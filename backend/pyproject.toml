[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mat3-surge-service"
version = "0.1.0"
description = "Weather alerts, dynamic fare surges, and push notifications for Mat3 routes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
